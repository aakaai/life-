# Vérifie que l'app iPhone compile (sur un Mac de GitHub, sans signature).
# Ne publie rien : l'installation sur l'iPhone se fait depuis Xcode sur ton Mac.
name: App iPhone (compilation)

on:
  push:
    branches: [main]
    paths: ['ios/**', 'capacitor.config.json', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: xcodebuild -version && xcrun simctl list runtimes | tail -5
      - name: Compiler pour le simulateur
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -80
      - name: Compiler pour l'iPhone (sans signature)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Lancer dans le simulateur et faire une capture
        if: matrix.os == 'macos-26'
        working-directory: ios/App
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if 'iPhone' in x['name'] and 'Pro' in x['name']))")
          xcrun simctl boot "$UDID"
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphonesimulator/App.app' -maxdepth 6 | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.aakaai.life
          sleep 25
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simulateur.png"
      - name: Publier la capture (branche ios-captures)
        if: matrix.os == 'macos-26'
        run: |
          cd "$RUNNER_TEMP" && mkdir cap && cd cap && git init -q && git checkout -q -b ios-captures
          cp "$GITHUB_WORKSPACE/simulateur.png" .
          git -c user.name=ci -c user.email=ci@example.com add . && git -c user.name=ci -c user.email=ci@example.com commit -q -m "capture"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-captures
